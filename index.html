<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AZ금융서비스 보험설계사 이종찬의 모바일 디지털 명함">
  <link rel="preload" href="PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="binder-core.css">
  <link rel="stylesheet" href="mobile-business-card.css">
  <title>이종찬 | AZ금융서비스 보험설계사</title>
</head>
<body>
  <main class="business-card">
    <header class="brand" aria-label="AZ금융서비스">
      <p class="brand__name">AZ금융서비스</p>
      <div class="brand__rule" aria-hidden="true"></div>
    </header>

    <section class="identity-card" aria-labelledby="agent-name">
      <img class="profile-photo" src="agent-profile-cutout.png" alt="AZ금융서비스 보험설계사 이종찬">
      <h1 id="agent-name" class="agent-name">이종찬</h1>
      <p class="agent-role">보험설계사</p>
      <a class="agent-phone" href="tel:01037715487" aria-label="이종찬에게 전화하기, 010-3771-5487">010-3771-5487</a>
    </section>

    <nav class="contact-actions" aria-label="연락 방법">
      <a class="contact-action contact-action--primary" href="tel:01037715487">전화하기</a>
      <a class="contact-action" href="sms:01037715487">문자하기</a>
      <a class="contact-action contact-action--save" href="lee-jongchan.vcf" download="이종찬_AZ금융서비스.vcf">연락처 저장</a>
    </nav>

    <section class="principles" aria-labelledby="principles-title">
      <h2 id="principles-title" class="section-title">설계 원칙</h2>
      <div class="principle-list">
        <article class="principle-card">
          <div class="principle-header"><span class="principle-number" aria-hidden="true">①</span><h3 class="principle-title">맞춤 보장</h3></div>
          <ul class="principle-items"><li>보장 분석</li><li>맞춤 설계</li></ul>
        </article>
        <article class="principle-card">
          <div class="principle-header"><span class="principle-number" aria-hidden="true">②</span><h3 class="principle-title">합리적 보험료</h3></div>
          <ul class="principle-items"><li>사업비 절감</li><li>고정지출 감소</li></ul>
        </article>
        <article class="principle-card">
          <div class="principle-header"><span class="principle-number" aria-hidden="true">③</span><h3 class="principle-title"><span class="amber-highlight">차액 저축</span></h3></div>
          <ul class="principle-items"><li>비과세 복리 저축 · 연금 · 상속</li></ul>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
