<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../share.css">
  <title>이종찬 명함 보내기 | 에즈금융서비스</title>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.2/kakao.min.js" integrity="sha384-zt/G7/KfaRQ9dT/QIkS0ujMtzouJqzuSJcXVQu50x0rl/+mD1dc70AeOejVbMD9E" crossorigin="anonymous"></script>
</head>
<body>
  <main class="share-page">
    <p class="share-page__company">에즈금융서비스</p>
    <h1>이종찬 보험설계사<br>명함 보내기</h1>
    <button id="kakao-share" type="button">카카오톡으로 명함 보내기</button>
    <a id="sms-share" href="sms:?body=" aria-label="문자로 명함 보내기">문자로 명함 보내기</a>
  </main>
  <script>
    (() => {
      const cardUrl = "https://leejgc.github.io/mobile-business-card/";
      const imageUrl = "https://leejgc.github.io/mobile-business-card/kakao-share-v4.png";
      const advisorDescription = [
        "안녕하세요.",
        "모바일 명함을 보내드립니다.",
        "보험 관련 문의는 편하게 연락 주세요."
      ].join("\n");
      const advisorSmsBody = [
        "안녕하세요.",
        "에즈금융서비스 보험설계사 이종찬입니다.",
        "",
        "제 모바일 명함을 보내드립니다.",
        "보험 관련 문의가 있으시면 편하게 연락 주세요.",
        "",
        cardUrl
      ].join("\n");
      const kakaoButton = document.querySelector("#kakao-share");
      const smsButton = document.querySelector("#sms-share");

      smsButton.href = "sms:?body=" + encodeURIComponent(advisorSmsBody);

      if (!window.Kakao) {
        kakaoButton.disabled = true;
        kakaoButton.textContent = "카카오톡 공유 기능을 불러오지 못했습니다";
        return;
      }
      if (!window.Kakao.isInitialized()) {
        window.Kakao.init("e1c62fd5c6c8d22e28e88e8e616ab613");
      }

      kakaoButton.addEventListener("click", () => {
        window.Kakao.Share.sendDefault({
          objectType: "feed",
          content: {
            title: "이종찬 | 에즈금융서비스",
            description: advisorDescription,
            imageUrl,
            imageWidth: 1200,
            imageHeight: 630,
            link: { mobileWebUrl: cardUrl, webUrl: cardUrl },
          },
          buttons: [{
            title: "명함 보기",
            link: { mobileWebUrl: cardUrl, webUrl: cardUrl },
          }],
        });
      });
    })();
  </script>
</body>
</html>
